name: Rebase tracking branch

on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    update-tracking:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: Tracking/requirements.txt

            - name: Setup Perl
              uses: shogo82148/actions-setup-perl@v1.33.0
              with:
                  perl-version: "5.38"
                  install-modules-with: cpanm
                  install-modules-args: --with-develop --with-configure

            # - name: Run Perl tests
            #   run: prove -lv t

            - name: Install Python dependencies
              run: pip install -r Tracking/requirements.txt

            - name: Connect Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:github-actions

            - name: Run texcount and ingest metrics
              env:
                  PGHOST: ${{ secrets.PGHOST }}
                  PGPORT: ${{ secrets.PGPORT }}
                  PGDATABASE: ${{ secrets.PGDATABASE }}
                  PGUSER: ${{ secrets.PGUSER }}
                  PGPASSWORD: ${{ secrets.PGPASSWORD }}
              run: python3 Tracking/analyse.py --tex-root thesis.tex --texcount-path Tracking/texcount.pl
