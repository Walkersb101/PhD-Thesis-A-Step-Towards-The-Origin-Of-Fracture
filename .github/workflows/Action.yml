name: Rebase tracking branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebase-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.38"
          install-modules-with: cpanm
          install-modules-args: --with-develop --with-configure

      - run: pip install polars matplotlib

      - run: perl Tracking/texcount.pl -dir -inc thesis.tex      
      - run: perl Tracking/texcount.pl -dir -inc thesis.tex -out=Tracking/output.texcount

      - run: python3 Tracking/analyse.py -i Tracking/output.texcount --db Tracking/progress.db

      - run: |
          git config --global user.name 'Walkersb101'
          git config --global user.email 'Walkersb10@users.noreply.github.com'
          git add .
          git commit -a -m "Update progress"
          git push



        
